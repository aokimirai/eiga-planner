name: Update showtime data

on:
  schedule:
    # 04:00 and 16:00 JST (19:00 / 07:00 UTC)
    - cron: "0 19 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run scrape
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/theaters.json data/screenings.json
          git diff --staged --quiet || git commit -m "chore: update showtime data"
          git push
